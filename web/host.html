<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<title>Punch Off — HOST</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");

  :root {
    color-scheme: dark;
    --background: #0a0a1a;
    --foreground: #f0f0f0;
    --surface: #0d0d2a;
    --surface-active: #1a1a5e;
    --border: #3a3a8e;
    --accent: #f8d800;
    --accent-dark: #7a5000;
    --muted: #8888cc;
    --highlight: #76d7ff;
    --primary: #e83030;
    --primary-shadow: #7a0000;
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; background: var(--background); }
  body {
    min-height: 100vh;
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: "Press Start 2P", ui-monospace, "Cascadia Code", monospace;
    font-size: 12px;
    overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 54px;
    padding: 10px clamp(14px, 3vw, 34px);
    border-bottom: 4px solid var(--border);
    background: color-mix(in srgb, var(--surface) 90%, #000);
  }
  .brand { color: var(--accent); font-size: clamp(10px, 1.8vw, 15px); letter-spacing: 1px; }

  .stage {
    position: relative;
    display: grid;
    place-items: center;
    padding: clamp(24px, 5vw, 58px) clamp(16px, 4vw, 48px);
    min-height: calc(100vh - 54px);
  }
  .grid-bg {
    position: fixed; inset: 0; pointer-events: none;
    opacity: .13;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  .panel {
    position: relative;
    z-index: 1;
    width: min(640px, 100%);
    padding: clamp(22px, 4vw, 38px);
    border: 4px solid var(--border);
    background: color-mix(in srgb, var(--surface) 92%, #000);
    box-shadow: 8px 8px 0 rgba(0, 0, 0, .35);
    text-align: center;
  }
  h1 {
    margin: 0 0 6px;
    color: var(--accent);
    font-size: clamp(16px, 3vw, 26px);
    line-height: 1.5;
    text-shadow: 4px 4px 0 var(--accent-dark);
  }
  .sub { margin: 0 0 28px; color: var(--highlight); font-size: 7px; line-height: 2; }

  #createBtn {
    display: inline-block;
    padding: 17px 26px;
    color: #fff;
    background: var(--primary);
    border: 0;
    box-shadow: 4px 4px 0 var(--primary-shadow);
    cursor: pointer;
    font-size: 9px;
    line-height: 1.5;
  }
  .code-box { margin-top: 30px; }
  .code-box strong { display: block; color: var(--muted); font-size: 7px; margin-bottom: 10px; }
  #code {
    color: var(--accent);
    font-size: clamp(30px, 8vw, 54px);
    letter-spacing: 10px;
    text-shadow: 4px 4px 0 var(--accent-dark);
  }
  #qrWrap { margin-top: 26px; }
  #qrWrap img {
    width: 196px;
    height: 196px;
    image-rendering: pixelated;
    border: 4px solid var(--border);
    background: #fff;
  }
  .qr-cap { margin-top: 12px; color: var(--muted); font-size: 6px; line-height: 1.9; }

  .row { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .link {
    display: inline-block;
    padding: 13px 16px;
    color: var(--foreground);
    background: var(--surface);
    border: 3px solid var(--border);
    text-decoration: none;
    font-size: 7px;
    line-height: 1.5;
  }
  .link.copy { background: var(--surface-active); border-color: var(--highlight); }
  .link.primary { color: var(--background); background: var(--accent); border-color: var(--accent-dark); box-shadow: 4px 4px 0 var(--accent-dark); }

  #notice { margin-top: 20px; min-height: 16px; color: var(--highlight); font-size: 7px; }
  #notice.error { color: var(--primary); }
  .foot { margin-top: 26px; color: var(--muted); font-size: 6px; line-height: 1.9; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">GO-TION ARCADE</div>
    <div class="brand" style="color:var(--highlight)">HOST LOBBY</div>
  </header>

  <main class="stage">
    <section class="panel">
      <h1>CREATE GAME</h1>
      <p class="sub">Start a private session. Only phones that join your code reach your game.</p>

      <button type="button" id="createBtn">CREATE GAME SESSION</button>

      <section class="code-box" id="codeBox" hidden>
        <strong>PHONE JOIN CODE</strong>
        <div id="code">----</div>
        <div class="qr-cap">Scan the QR or type the code on a phone to open the sensor page.</div>
      </section>

      <section id="qrWrap" hidden>
        <img id="qr" alt="Join QR code">
      </section>

      <div class="row" id="actions" hidden>
        <a class="link primary" id="openGame" target="_blank" rel="noopener">OPEN PUNCH OFF</a>
        <button type="button" class="link copy" id="copyLink">COPY PHONE LINK</button>
      </div>

      <p id="notice"></p>
      <p class="foot" id="foot">The join page is only valid while this session is active.</p>
    </section>
  </main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const notice = (text, error) => {
    $("notice").textContent = text;
    $("notice").className = error ? "error" : "";
  };

  $("createBtn").onclick = async () => {
    notice("Creating session…");
    try {
      const res = await fetch("/session", { method: "POST" });
      if (!res.ok) throw new Error("server rejected session creation");
      const data = await res.json();

      $("code").textContent = data.code;
      $("qr").src = data.qrPng;
      $("openGame").href = data.gameUrl;
      $("codeBox").hidden = false;
      $("qrWrap").hidden = false;
      $("actions").hidden = false;
      $("createBtn").disabled = true;

      // store for copy
      window.__joinUrl = data.joinUrl;
      window.__phoneUrl = data.url;
      notice("Session ready. Codes expire when the session times out.");
    } catch (e) {
      notice("Could not create session: " + e.message, true);
    }
  };

  $("copyLink").onclick = async () => {
    const url = window.__phoneUrl || "";
    try {
      await navigator.clipboard.writeText(url);
      notice("Phone link copied.");
    } catch {
      notice("Could not copy; select the address manually.");
    }
  };
})();
</script>
</body>
</html>
